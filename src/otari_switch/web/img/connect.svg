<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="An app connected to a gateway that reaches several models">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A2E"/><stop offset="1" stop-color="#1E1E21"/></linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3DDFF"/><stop offset="0.45" stop-color="#A855F7"/><stop offset="1" stop-color="#4C1D95"/></linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9C6FF"/></linearGradient>
    <filter id="soft" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <ellipse cx="120" cy="166" rx="96" ry="7" fill="#05010F" opacity="0.6" filter="url(#soft)"/>
  <!-- app card -->
  <rect x="14" y="52" width="70" height="78" rx="16" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <circle cx="27" cy="65" r="3" fill="#BBAEF6"/><circle cx="37" cy="65" r="3" fill="#D5F26B"/>
  <rect x="24" y="78" width="40" height="6" rx="3" fill="#BBAEF6" opacity="0.85"/>
  <rect x="24" y="90" width="28" height="6" rx="3" fill="#3A3A3E"/>
  <rect x="24" y="102" width="46" height="6" rx="3" fill="#D5F26B"/>
  <rect x="24" y="114" width="22" height="6" rx="3" fill="#3A3A3E"/>
  <!-- cable from app to gateway -->
  <path d="M84 92 C100 92 100 90 104 90" fill="none" stroke="#D5F26B" stroke-width="6" stroke-linecap="round"/>
  <!-- gateway hub -->
  <circle cx="126" cy="90" r="25" fill="url(#hub)"/>
  <circle cx="126" cy="90" r="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M129 74 L117 92 H125 L122 106 L135 87 H127 Z" fill="url(#bolt)" stroke="url(#bolt)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M110 80 A18 18 0 0 1 120 72" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
  <!-- routes to models -->
  <path d="M151 90 C170 90 172 50 192 50" fill="none" stroke="#D5F26B" stroke-width="4" stroke-linecap="round"/>
  <path d="M151 90 H190" fill="none" stroke="#BBAEF6" stroke-width="4" stroke-linecap="round"/>
  <path d="M151 90 C170 90 172 130 192 130" fill="none" stroke="#3A3A3E" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7"/>
  <circle cx="206" cy="50" r="15" fill="#D5F26B"/><circle cx="206" cy="50" r="6" fill="#0E1203"/>
  <circle cx="204" cy="90" r="15" fill="#BBAEF6"/><circle cx="204" cy="90" r="6" fill="#17112E"/>
  <circle cx="206" cy="130" r="15" fill="#2E2E31"/><circle cx="206" cy="130" r="6" fill="#5F5F65"/>
  <path d="M172 24 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#D5F26B"/>
  <path d="M100 30 l1.8 4.6 4.6 1.8 -4.6 1.8 -1.8 4.6 -1.8 -4.6 -4.6 -1.8 4.6 -1.8z" fill="#BBAEF6"/>
</svg>
