<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="Balance scale">
  <defs>
    <linearGradient id="knob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3DDFF"/><stop offset="0.5" stop-color="#A855F7"/><stop offset="1" stop-color="#5B21B6"/></linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4A4A50"/><stop offset="0.5" stop-color="#6A6A72"/><stop offset="1" stop-color="#3A3A3E"/></linearGradient>
    <linearGradient id="panL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6FA97"/><stop offset="1" stop-color="#B6D545"/></linearGradient>
    <linearGradient id="panR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9D1FB"/><stop offset="1" stop-color="#9F90EE"/></linearGradient>
    <filter id="soft" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <ellipse cx="120" cy="166" rx="80" ry="7" fill="#05010F" opacity="0.6" filter="url(#soft)"/>
  <rect x="80" y="150" width="80" height="14" rx="7" fill="#2A2A2C"/>
  <rect x="96" y="142" width="48" height="12" rx="6" fill="#36363A"/>
  <rect x="115" y="42" width="10" height="104" rx="5" fill="url(#post)"/>
  <g transform="rotate(-7 120 46)">
    <rect x="38" y="42" width="164" height="8" rx="4" fill="#BBAEF6"/>
    <path d="M44 50 L28 104 M44 50 L62 104" stroke="#8E8E93" stroke-width="2"/>
