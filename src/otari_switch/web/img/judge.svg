  <rect x="187" y="85" width="18" height="3.5" rx="1.75" fill="#BBAEF6"/><rect x="187" y="91" width="12" height="3.5" rx="1.75" fill="#BBAEF6" opacity="0.6"/>
  <path d="M164 18 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#D5F26B"/>
