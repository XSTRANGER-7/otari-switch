[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otari-switch"
version = "0.1.0"
description = "Move an AI app from frontier APIs to open-weight models through Otari, one call site at a time, with proof."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Vikram" }]
keywords = ["otari", "llm", "gateway", "open-weight", "migration", "mozilla-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
otari-switch = "otari_switch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otari_switch = ["web/*", "web/**/*", "demo/**/*", "demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
