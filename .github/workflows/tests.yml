name: tests

on:
  push:
    branches: [main, devs-wilding]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]" openai
      - name: Git identity for the sample repo's commits
        run: |
          git config --global user.name "otari-switch-ci"
          git config --global user.email "ci@otari-switch.local"
          git config --global init.defaultBranch main
      - name: Offline tests (demo gateway, no key, no cost)
        run: python -m pytest -o addopts="" -q
      - name: Demo end to end
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          otari-switch demo --cli | tee demo.log
          grep -q "4 of 5 calls can switch" demo.log
